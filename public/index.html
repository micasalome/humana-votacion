<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Humana para humanos – Vota por tu foto favorita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&amp;family=Fredoka:wght@600;700&amp;family=Quicksand:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B5AA6}a:hover{color:#083F7E}
button{font-family:inherit}
@keyframes titilar{0%,100%{opacity:.3;transform:scale(.7)}50%{opacity:1;transform:scale(1.35)}}
@keyframes destello{0%,100%{opacity:.5;transform:scale(.7) rotate(0deg)}50%{opacity:1;transform:scale(1.2) rotate(25deg)}}
@keyframes fugaz{0%{transform:rotate(-32deg) translateX(0);opacity:0}3%{opacity:1}12%{transform:rotate(-32deg) translateX(-700px);opacity:0}100%{transform:rotate(-32deg) translateX(-700px);opacity:0}}
@keyframes flotarRobot{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes halo{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.55;transform:scale(1.08)}}
@keyframes flotar{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@media (max-width: 1100px){.hero-robot{position:relative !important;left:auto !important;top:auto !important;width:230px !important;margin:28px auto 0}.burbuja-robot{left:70% !important;font-size:15px !important}}
@media (max-width: 760px){.pill-vivo{position:static !important;margin:12px auto 0}header{flex-direction:column;align-items:center !important}}
@media (max-width: 600px){.cinta{padding:10px 30px 12px !important}.cinta span{font-size:22px !important}.chispa{display:none}.sub-titulo{font-size:24px !important}.sub-titulo br{display:none}.cta-pill{border-radius:28px !important;padding:14px 16px !important;gap:10px !important}.cta-pill p{font-size:19px !important}.cta-pill span[aria-hidden]{font-size:36px !important}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
</head>
<body>
<div id="app"></div>
<template id="plantilla">
<div style="position: relative; overflow: hidden; min-height: 2050px; font-family: 'Quicksand', system-ui, sans-serif; color: #0A3566; background: radial-gradient(ellipse 80% 50% at 70% 8%, rgba(70, 140, 255, 0.35) 0%, rgba(70, 140, 255, 0) 70%), linear-gradient(180deg, #040C26 0%, #081B4E 28%, #0B2C72 58%, #12469E 100%)">

  <div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none">
    <sc-for list="{{estrellas}}" as="e" hint-placeholder-count="0">
      <span style="{{e.style}}"></span>
    </sc-for>
    <sc-for list="{{destellos}}" as="d" hint-placeholder-count="0">
      <span style="{{d.wrap}}">
        <span style="{{d.halo}}"></span>
        <svg style="{{d.style}}" width="24" height="24" viewBox="0 0 24 24"><path d="M12 0 C13 8 16 11 24 12 C16 13 13 16 12 24 C11 16 8 13 0 12 C8 11 11 8 12 0 Z" fill="#ffffff"></path></svg>
      </span>
    </sc-for>
    <span style="position: absolute; left: 78%; top: 90px; width: 180px; height: 2px; border-radius: 2px; background: linear-gradient(90deg, #ffffff, rgba(160, 210, 255, 0.6) 30%, rgba(160, 210, 255, 0)); box-shadow: 0 0 8px #ffffff; transform-origin: left center; animation: fugaz 9s linear 2s infinite; opacity: 0"></span>
    <span style="position: absolute; left: 40%; top: 40px; width: 140px; height: 2px; border-radius: 2px; background: linear-gradient(90deg, #ffffff, rgba(160, 210, 255, 0.6) 30%, rgba(160, 210, 255, 0)); box-shadow: 0 0 8px #ffffff; transform-origin: left center; animation: fugaz 13s linear 6s infinite; opacity: 0"></span>
    <span style="position: absolute; left: 95%; top: 1100px; width: 160px; height: 2px; border-radius: 2px; background: linear-gradient(90deg, #ffffff, rgba(160, 210, 255, 0.6) 30%, rgba(160, 210, 255, 0)); box-shadow: 0 0 8px #ffffff; transform-origin: left center; animation: fugaz 11s linear 4s infinite; opacity: 0"></span>
  </div>
  <div aria-hidden="true" style="position: absolute; top: 520px; left: -160px; width: 720px; height: 240px; border-radius: 50%; background: #6FA8FF; opacity: 0.14; filter: blur(60px)"></div>
  <div aria-hidden="true" style="position: absolute; top: 1300px; right: -120px; width: 760px; height: 280px; border-radius: 50%; background: #6FA8FF; opacity: 0.12; filter: blur(70px)"></div>

  <div style="position: relative; max-width: 1200px; margin: 0 auto; padding: 0 24px 64px; display: flex; flex-direction: column; gap: 48px">

    <header style="position: relative; display: flex; justify-content: center; align-items: flex-start; min-height: 110px">
      <div style="background: #ffffff; border-radius: 0 0 56px 56px; padding: 20px 52px 22px; box-shadow: 0 0 0 6px rgba(140, 200, 255, 0.18), 0 18px 40px rgba(0, 10, 40, 0.5); display: flex">
        <img src="img/logo-humana.png" alt="humana · Cobertura Médica Integral" style="height: 64px; width: auto; display: block">
      </div>
      <div class="pill-vivo" style="position: absolute; right: 0; top: 30px; display: flex; align-items: center; gap: 12px; color: #ffffff; font-weight: 700; font-size: 20px; background: rgba(6, 22, 70, 0.6); border: 2px solid #5FB6FF; border-radius: 999px; padding: 12px 26px; box-shadow: 0 0 18px rgba(95, 182, 255, 0.55), inset 0 0 12px rgba(95, 182, 255, 0.25)">
        <span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 50%; background: #3DF29A; box-shadow: 0 0 0 4px rgba(61, 242, 154, 0.25), 0 0 12px #3DF29A"></span>
        Votación en vivo
      </div>
    </header>

    <section style="position: relative; display: flex; flex-direction: column; align-items: center; margin-top: -24px">
      <div aria-hidden="true" style="position: absolute; left: -420px; right: -420px; bottom: -140px; height: 340px; pointer-events: none; z-index: 0">
        <sc-for list="{{nubes}}" as="n" hint-placeholder-count="0">
          <span style="{{n.style}}"></span>
        </sc-for>
      </div>

      <div class="hero-centro" style="position: relative; z-index: 1; width: 100%; max-width: 680px; display: flex; flex-direction: column; align-items: center; gap: 22px; text-align: center">
        <div style="display: flex; align-items: center; gap: 14px">
          <svg class="chispa" aria-hidden="true" width="44" height="60" viewBox="0 0 44 60" style="filter: drop-shadow(0 0 6px #6FD6FF)"><path d="M38 8 L22 20 M40 30 L16 30 M38 52 L22 40" stroke="#9BE7FF" stroke-width="5" stroke-linecap="round" fill="none"></path></svg>
          <div class="cinta" style="position: relative; padding: 14px 64px 16px">
            <svg aria-hidden="true" viewBox="0 0 100 100" preserveAspectRatio="none" style="position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 0 8px rgba(110, 200, 255, 0.8))"><path d="M1 4 H99 L93 50 L99 96 H1 L7 50 Z" fill="rgba(8, 32, 96, 0.85)" stroke="#8FD8FF" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"></path></svg>
            <span style="position: relative; display: block; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 32px; line-height: 1.12; letter-spacing: 1px; color: #ffffff; text-shadow: 0 0 10px rgba(150, 215, 255, 0.7)">VOTA POR TU<br>FOTO FAVORITA</span>
          </div>
          <svg class="chispa" aria-hidden="true" width="44" height="60" viewBox="0 0 44 60" style="transform: scaleX(-1); filter: drop-shadow(0 0 6px #6FD6FF)"><path d="M38 8 L22 20 M40 30 L16 30 M38 52 L22 40" stroke="#9BE7FF" stroke-width="5" stroke-linecap="round" fill="none"></path></svg>
        </div>

        <h1 aria-label="Humana para humanos como tú" style="margin: 0; display: flex; flex-direction: column; align-items: center; font-family: 'Fredoka', 'Baloo 2', sans-serif; font-weight: 700; line-height: 0.9; animation: flotar 6s ease-in-out infinite">
          <sc-for list="{{titulo}}" as="fila" hint-placeholder-count="4">
            <span aria-hidden="true" style="display: flex; align-items: flex-end; white-space: nowrap">
              <sc-for list="{{fila.letras}}" as="l" hint-placeholder-count="6">
                <span style="{{l.style}}">{{l.ch}}</span>
              </sc-for>
            </span>
          </sc-for>
        </h1>

        <div style="display: flex; align-items: center; gap: 16px; margin-top: 6px">
          <svg class="chispa" aria-hidden="true" width="36" height="50" viewBox="0 0 44 60" style="flex: none; filter: drop-shadow(0 0 6px #6FD6FF)"><path d="M38 8 L22 20 M40 30 L16 30 M38 52 L22 40" stroke="#9BE7FF" stroke-width="5" stroke-linecap="round" fill="none"></path></svg>
          <span aria-hidden="true" style="font-size: 52px; line-height: 1">📸</span>
          <p class="sub-titulo" style="margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 34px; line-height: 1.15; color: #ffffff; text-shadow: 0 0 14px rgba(120, 190, 255, 0.55), 0 3px 0 rgba(4, 20, 60, 0.6)">¡Demasiada diversión <br>para un solo algoritmo!</p>
          <svg class="chispa" aria-hidden="true" width="36" height="50" viewBox="0 0 44 60" style="flex: none; transform: scaleX(-1); filter: drop-shadow(0 0 6px #6FD6FF)"><path d="M38 8 L22 20 M40 30 L16 30 M38 52 L22 40" stroke="#9BE7FF" stroke-width="5" stroke-linecap="round" fill="none"></path></svg>
        </div>

        <p style="margin: 0; font-size: 22px; font-weight: 600; line-height: 1.4; color: #ffffff; text-shadow: 0 1px 3px rgba(0, 10, 40, 0.6)">Las selfies están listas, pero nuestro robot no puede decidir.</p>

        <div class="cta-pill" style="display: flex; align-items: center; gap: 18px; padding: 14px 34px 14px 22px; border-radius: 999px; background: rgba(6, 22, 70, 0.6); border: 2px solid #5FB6FF; box-shadow: 0 0 22px rgba(95, 182, 255, 0.55), inset 0 0 14px rgba(95, 182, 255, 0.25)">
          <span aria-hidden="true" style="font-size: 48px; line-height: 1">🤖</span>
          <p style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 25px; line-height: 1.2; color: #ffffff; font-weight: 500">
            <span>¡Activa tu lado más humano y <strong style="font-weight: 700">vota</strong></span>
            <strong style="font-family: 'Fredoka', sans-serif; font-weight: 700; background: rgba(95, 182, 255, 0.2); border: 1.5px solid #8FD8FF; border-radius: 999px; padding: 2px 18px; box-shadow: 0 0 10px rgba(95, 182, 255, 0.45)">por tu favorita en cada ciudad!</strong>
          </p>
        </div>

        <div role="timer" aria-live="off" style="margin-top: 10px; width: 100%; max-width: 560px; background: rgba(6, 22, 70, 0.6); border: 2px solid rgba(143, 216, 255, 0.6); border-radius: 28px; padding: 18px 22px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 0 20px rgba(95, 182, 255, 0.3)">
          <sc-if value="{{open}}" hint-placeholder-val="{{ true }}">
            <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap">
              <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 20px; color: #ffffff">La votación cierra en</span>
              <span style="font-weight: 700; font-size: 15px; color: #BFE3FF">Miércoles 11 de noviembre · 5:00 p. m.</span>
            </div>
            <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
              <sc-for list="{{countdown}}" as="u" hint-placeholder-count="4">
                <div style="background: rgba(95, 182, 255, 0.16); border: 1.5px solid #8FD8FF; border-radius: 18px; padding: 10px 6px 8px; display: flex; flex-direction: column; align-items: center; min-width: 64px">
                  <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 42px; line-height: 1; color: #ffffff; font-variant-numeric: tabular-nums; text-shadow: 0 0 12px rgba(150, 215, 255, 0.8)">{{u.value}}</span>
                  <span style="font-size: 13px; font-weight: 700; color: #BFE3FF; text-transform: uppercase; letter-spacing: 1px">{{u.label}}</span>
                </div>
              </sc-for>
            </div>
          </sc-if>
          <sc-if value="{{closed}}" hint-placeholder-val="{{ false }}">
            <div style="display: flex; flex-direction: column; gap: 4px; text-align: center">
              <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 28px; color: #ffffff">La votación ha cerrado</span>
              <span style="font-weight: 600; font-size: 15px; color: #BFE3FF">Cerró el miércoles 11 de noviembre a las 5:00 p. m. ¡Gracias por participar!</span>
            </div>
          </sc-if>
        </div>
      </div>

      <div class="hero-robot" style="position: absolute; z-index: 2; left: -150px; top: 70px; width: 360px">
        <div aria-hidden="true" style="position: absolute; left: -10%; top: 4%; width: 120%; height: 70%; border-radius: 50%; background: radial-gradient(circle, rgba(90, 160, 255, 0.55) 0%, rgba(60, 120, 255, 0.2) 45%, rgba(60, 120, 255, 0) 70%); animation: halo 5s ease-in-out infinite"></div>
        <div aria-hidden="true" style="position: absolute; left: 8%; bottom: -14px; width: 84%; height: 46px; border-radius: 50%; background: radial-gradient(ellipse, rgba(150, 210, 255, 0.7) 0%, rgba(90, 160, 255, 0.25) 45%, rgba(90, 160, 255, 0) 72%); filter: blur(2px)"></div>
        <div style="position: relative; animation: flotarRobot 5s ease-in-out infinite">
          <img src="img/robot.png" alt="Robot de la campaña Humana presentando la votación" style="display: block; width: 100%; height: auto; filter: drop-shadow(0 0 1.5px rgba(220, 240, 255, 0.95)) drop-shadow(0 0 18px rgba(120, 180, 255, 0.75)) drop-shadow(0 30px 30px rgba(0, 0, 0, 0.5))">
          <div class="burbuja-robot" style="position: absolute; left: 50%; top: -5%; white-space: nowrap; background: #ffffff; color: #0B3A9A; border-radius: 20px 20px 20px 4px; padding: 10px 16px; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 17px; box-shadow: 0 0 0 3px rgba(143, 216, 255, 0.6), 0 12px 24px rgba(0, 10, 40, 0.45)">¡Ayúdame a elegir!</div>
        </div>
      </div>
    </section>

    <section aria-labelledby="titulo-votacion" style="position: relative; z-index: 3; background: rgba(255, 255, 255, 0.94); backdrop-filter: blur(12px); border: 1.5px solid rgba(255, 255, 255, 0.9); border-radius: 36px; padding: 32px; display: flex; flex-direction: column; gap: 28px; box-shadow: 0 24px 60px rgba(6, 47, 99, 0.18)">
      <div style="display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 20px">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <h2 id="titulo-votacion" style="margin: 0; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 40px; line-height: 1; color: #0B5AA6">Elige tu ciudad y vota</h2>
          <p style="margin: 0; font-size: 17px; font-weight: 600; color: #2D4F78">Elige una foto en cada ciudad y luego envía tu voto.</p>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 15px; color: #0A3566">
          <span>Tu progreso</span>
          <div style="display: flex; gap: 6px">
            <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
              <span style="{{t.dotStyle}}" title="{{t.label}}"></span>
            </sc-for>
          </div>
          <span>{{votedCount}} de 3 elegidas</span>
        </div>
      </div>

      <div role="tablist" aria-label="Ciudades" style="display: flex; flex-wrap: wrap; gap: 12px">
        <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
          <button role="tab" aria-selected="{{t.active}}" onClick="{{t.pick}}" style="{{t.tabStyle}}">
            {{t.label}}
            <sc-if value="{{t.voted}}" hint-placeholder-val="{{ false }}">
              <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
            </sc-if>
          </button>
        </sc-for>
      </div>

      <sc-if value="{{showPickMsg}}" hint-placeholder-val="{{ false }}">
        <div role="status" style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px; background: #E3F2FD; color: #0A3566; border: 2px solid #0B5AA6; border-radius: 20px; padding: 14px 18px 14px 22px; font-weight: 700; font-size: 17px">
          <span>{{pickMsg}}</span>
          <sc-if value="{{hasNext}}" hint-placeholder-val="{{ false }}">
            <button onClick="{{goNext}}" style="min-height: 44px; padding: 0 22px; border-radius: 999px; border: 0; background: #0B5AA6; color: #ffffff; font-weight: 700; font-size: 16px; cursor: pointer">Ir a {{nextLabel}}</button>
          </sc-if>
        </div>
      </sc-if>
      <sc-if value="{{submitted}}" hint-placeholder-val="{{ false }}">
        <div role="status" style="display: flex; align-items: center; gap: 14px; background: #0B5AA6; color: #ffffff; border-radius: 20px; padding: 16px 22px; font-weight: 700; font-size: 17px">
          <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M7.5 12.5l3 3 6-6.5"></path></svg>
          <span>¡Gracias! Tu voto por Quito, Guayaquil y Cuenca fue enviado. Puedes volver a votar cuando quieras.</span>
        </div>
      </sc-if>

      <div style="{{gridStyle}}">
        <sc-for list="{{cards}}" as="card" hint-placeholder-count="6">
          <article style="{{card.cardStyle}}">
            <sc-if value="{{card.hasPhoto}}" hint-placeholder-val="{{ false }}">
              <img src="{{card.src}}" alt="{{card.alt}}" loading="lazy" style="{{card.imgStyle}}">
            </sc-if>
            <sc-if value="{{card.noPhoto}}" hint-placeholder-val="{{ true }}">
              <div style="aspect-ratio: 4 / 5; background: linear-gradient(160deg, #DDF0FD 0%, #B5DDF8 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: #2D6CA8">
                <svg aria-hidden="true" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L17 6h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                <span style="font-weight: 700; font-size: 15px">[Foto del participante]</span>
              </div>
            </sc-if>
            <div style="padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 14px">
              <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
                <span style="font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 22px; color: #0A3566">{{card.title}}</span>
                <span style="font-size: 13px; font-weight: 700; color: #0B5AA6; background: #E3F2FD; border-radius: 999px; padding: 4px 10px">{{cityLabel}}</span>
              </div>
              <div style="display: flex; flex-direction: column; gap: 6px">
                <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px">
                  <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 22px; color: #0B5AA6">{{card.pctLabel}}</span>
                  <span style="font-size: 14px; font-weight: 600; color: #2D4F78">{{card.votosLabel}}</span>
                </div>
                <div style="height: 10px; border-radius: 999px; background: #E3F2FD; overflow: hidden">
                  <div style="{{card.barStyle}}"></div>
                </div>
              </div>
              <button onClick="{{card.vote}}" disabled="{{card.disabled}}" aria-pressed="{{card.selected}}" style="{{card.btnStyle}}">{{card.btnLabel}}</button>
            </div>
          </article>
        </sc-for>
      </div>

      <div style="position: sticky; bottom: 16px; z-index: 2; background: #0A2463; color: #ffffff; border-radius: 24px; padding: 18px 20px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; box-shadow: 0 18px 40px rgba(4, 12, 38, 0.45)">
        <div style="display: flex; flex-wrap: wrap; gap: 10px">
          <sc-for list="{{resumen}}" as="r" hint-placeholder-count="3">
            <div style="{{r.style}}">
              <span style="font-size: 13px; font-weight: 600; opacity: 0.85">{{r.label}}</span>
              <span style="font-size: 15px; font-weight: 700">{{r.value}}</span>
            </div>
          </sc-for>
        </div>
        <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex: 1 1 220px">
          <button onClick="{{send}}" disabled="{{cantSend}}" style="{{sendStyle}}">{{sendLabel}}</button>
          <span style="font-size: 14px; font-weight: 600; color: #CFE3FA; text-align: right">{{sendHint}}</span>
        </div>
      </div>
    </section>

    <sc-if value="{{showTop}}" hint-placeholder-val="{{ true }}">
      <section aria-labelledby="titulo-top" style="position: relative; z-index: 3; display: flex; flex-direction: column; gap: 24px">
        <div style="display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 12px">
          <div style="display: flex; flex-direction: column; gap: 6px">
            <h2 id="titulo-top" style="margin: 0; font-family: 'Fredoka', 'Baloo 2', sans-serif; font-weight: 700; font-size: 44px; line-height: 1; color: #ffffff; text-shadow: 0 0 24px rgba(110, 170, 255, 0.6)">Top 3 en vivo</h2>
            <p style="margin: 0; font-size: 17px; font-weight: 600; color: #CFE3FA">La foto más votada de Quito, Guayaquil y Cuenca.</p>
          </div>
          <div style="display: flex; align-items: center; gap: 10px; color: #ffffff; font-weight: 700; font-size: 15px; background: rgba(255, 255, 255, 0.1); border: 1.5px solid rgba(255, 255, 255, 0.35); border-radius: 999px; padding: 8px 16px">
            <span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 50%; background: #7CF0B0; box-shadow: 0 0 0 4px rgba(124, 240, 176, 0.3)"></span>
            Votos en vivo
          </div>
        </div>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px">
          <sc-for list="{{top}}" as="col" hint-placeholder-count="3">
            <article style="background: #ffffff; border-radius: 28px; padding: 22px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 18px 40px rgba(4, 12, 38, 0.35)">
              <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px">
                <h3 style="margin: 0; font-family: 'Fredoka', 'Baloo 2', sans-serif; font-weight: 700; font-size: 28px; color: #0B5AA6">{{col.label}}</h3>
                <span style="font-size: 14px; font-weight: 700; color: #2D4F78">{{col.totalLabel}}</span>
              </div>

        estrellas.push({ style: 'position:absolute;left:' + (rnd() * 100).toFixed(2) + '%;top:' + (rnd() * 100).toFixed(2) + '%;width:' + size + 'px;height:' + size + 'px;border-radius:50%;background:#ffffff;box-shadow:0 0 ' + (size * 2) + 'px #ffffff, 0 0 ' + (size * 6) + 'px rgba(150,205,255,.95);animation:titilar ' + (1.8 + rnd() * 2.5).toFixed(1) + 's ease-in-out ' + (rnd() * 4).toFixed(1) + 's infinite;' });
      }
      // Destellos de 4 puntas: más grandes y concentrados en el encabezado
      var destellos = [
        ['22%', 150, 34], ['78%', 300, 30], ['70%', 60, 18], ['30%', 420, 20], ['85%', 560, 24], ['15%', 640, 16],
        ['92%', 200, 14], ['5%', 120, 20], ['60%', 700, 14], ['48%', 30, 12], ['36%', 760, 22], ['66%', 470, 16],
        ['8%', 1300, 22], ['94%', 1700, 26], ['4%', 2300, 18], ['96%', 2900, 22], ['6%', 3500, 20], ['95%', 4100, 18]
      ].map(function (p, j) {
        var d = (2.2 + (j % 4) * 0.7).toFixed(1) + 's ease-in-out ' + (j * 0.45).toFixed(2) + 's infinite;';
        return {
          wrap: 'position:absolute;left:' + p[0] + ';top:' + p[1] + 'px;width:' + p[2] + 'px;height:' + p[2] + 'px;',
          halo: 'position:absolute;left:50%;top:50%;width:' + (p[2] * 2.6) + 'px;height:' + (p[2] * 2.6) + 'px;margin:-' + (p[2] * 1.3) + 'px 0 0 -' + (p[2] * 1.3) + 'px;border-radius:50%;background:radial-gradient(circle, rgba(170,215,255,.55) 0%, rgba(120,180,255,.18) 40%, rgba(120,180,255,0) 70%);animation:halo ' + d,
          style: 'position:relative;display:block;width:100%;height:100%;filter:drop-shadow(0 0 4px #ffffff) drop-shadow(0 0 12px rgba(150,210,255,1));animation:destello ' + d
        };
      });
      // Letras tipo globo inspiradas en el arte de la campaña
      var tonos = {
        oscuro: { a: '#9FD0FF', b: '#3C8DFF', c: '#1F62EC', d: '#0C3BB0', glow: 'rgba(70,150,255,.65)' },
        claro: { a: '#E6FAFF', b: '#7FDBFF', c: '#2CB4F5', d: '#0C79C9', glow: 'rgba(90,210,255,.6)' },
        cian: { a: '#F2FCFF', b: '#8FE3FF', c: '#36BDF7', d: '#0D7FCC', glow: 'rgba(110,220,255,.65)' }
      };
      var rot = [-3, 2, -1, 3, -2, 1, -3, 2];
      var dy = [0, -4, 2, -2, 3, -1, 2, -3];
      var fila = function (texto, tono, size) {
        var t = tonos[tono];
        return { letras: texto.split('').map(function (ch, m) {
          var fs = 'min(' + size + 'px, ' + (size / 8).toFixed(1) + 'vw)';
          if (ch === ' ') return { ch: ' ', style: 'display:inline-block;font-size:' + fs + ';width:0.28em;' };
          return { ch: ch, style: 'display:inline-block;font-size:' + fs + ';margin:0 -2px;transform:rotate(' + rot[m % rot.length] + 'deg) translateY(' + dy[m % dy.length] + 'px);background:radial-gradient(ellipse 30% 16% at 32% 22%, rgba(255,255,255,.95) 0%, rgba(255,255,255,.6) 45%, rgba(255,255,255,0) 100%), linear-gradient(180deg, ' + t.a + ' 0%, ' + t.b + ' 32%, ' + t.c + ' 68%, ' + t.d + ' 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 0 ' + t.d + ') drop-shadow(0 0 1.5px rgba(220,240,255,.9)) drop-shadow(0 0 26px ' + t.glow + ') drop-shadow(0 18px 20px rgba(0,0,0,.5));' };
        }) };
      };
      this._cielo = {
        estrellas: estrellas,
        destellos: destellos,
        titulo: [fila('HUMANA', 'oscuro', 120), fila('PARA', 'claro', 104), fila('HUMANOS', 'oscuro', 116), fila('COMO TÚ', 'cian', 108)],
        // Nubes nocturnas en las esquinas inferiores del encabezado
        nubes: (function () {
          var out = [];
          var grupo = function (lado, baseX) {
            // base ancha + bultos redondos encima, con bordes suaves
            var piezas = [[0, 0, 640, 170], [40, 70, 210], [190, 95, 260], [380, 80, 220], [520, 50, 170], [110, 150, 150], [300, 175, 170], [470, 130, 120]];
            piezas.forEach(function (q) {
              var w = q[2], h = q[3] || q[2];
              out.push({ style: 'position:absolute;' + lado + ':' + (baseX + q[0]) + 'px;bottom:' + q[1] + 'px;width:' + w + 'px;height:' + h + 'px;border-radius:' + (q[3] ? '50% / 60%' : '50%') + ';background:radial-gradient(ellipse at 50% 22%, #7FA6EC 0%, #4A73C6 28%, #24489A 60%, #102C6A 100%);box-shadow:inset 0 18px 30px rgba(200,222,255,.28), inset 0 -20px 40px rgba(5,15,50,.45);filter:blur(1.5px);opacity:.95;' });
            });
          };
          grupo('left', 0); grupo('right', 0);
          return out;
        })()
      };
    }
    return { estrellas: this._cielo.estrellas, destellos: this._cielo.destellos, titulo: this._cielo.titulo, nubes: this._cielo.nubes, open: open, closed: !open, countdown: countdown, tabs: tabs, cards: cards, cityLabel: cityLabel, votedCount: votedCount,
      showPickMsg: !!lastPick && !submitted, pickMsg: pickMsg,
      hasNext: !!lastPick && !submitted && !!next, nextLabel: next ? next.label : '',
      goNext: function () { if (next) self.setState({ city: next.id, lastPick: null }); },
      showTop: this.props.mostrarTop3 ?? true, top: top,
      gridStyle: 'display:grid;gap:24px;grid-template-columns:repeat(auto-fill, minmax(min(100%, ' + (city === 'quito' ? 340 : 250) + 'px), 1fr));',
      submitted: submitted, resumen: resumen, cantSend: !(canSend || (submitted && open)),
      sendLabel: submitted ? (open ? 'Votar otra vez' : '✓ Voto enviado') : 'Enviar mi voto',
      sendHint: sendHint,
      sendStyle: 'min-height:52px;padding:0 32px;border-radius:999px;border:0;font-weight:700;font-size:18px;' + (canSend || (submitted && open) ? 'background:#ffffff;color:#0A2463;cursor:pointer;box-shadow:0 0 0 4px rgba(120,190,255,.35);' : (submitted ? 'background:#1E6FD0;color:#ffffff;cursor:default;' : 'background:#3A5488;color:#B9C8E4;cursor:not-allowed;')),
      send: function () {
        if (Date.now() >= closeAt) return;
        if (self.state.submitted) {
          // Empezar un voto nuevo
          self.setState({ votes: { quito: null, guayaquil: null, cuenca: null }, submitted: false, lastPick: null, aviso: null, city: 'quito' });
          return;
        }
        if (!canSend) return;
        self.enviarVoto(votes);
      }
    };
  }
}

montar(Component);
